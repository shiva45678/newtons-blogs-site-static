<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Newton's Group Blogs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .error-content {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #667eea;
            margin: 0;
        }
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin: 1rem 0;
        }
        .error-message {
            font-size: 1.1rem;
            color: #718096;
            margin: 1.5rem 0;
        }
        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1a202c;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">The page you're looking for doesn't exist or has been moved. Don't worry, we have plenty of other great content!</p>
            <div class="error-buttons">
                <a href="/" class="btn btn-primary">← Back to Blog</a>
                <a href="https://newtons.in" class="btn btn-secondary">Visit Newton's Home</a>
            </div>
        </div>
    </div>
    <script>
        // Try to redirect to the correct blog post if the slug is in the URL
        const path = window.location.pathname;
        const match = path.match(/\/blogs\/([^\/]+)\/?$/);
        if (match) {
            const slug = match[1];
            window.location.href = `/blogs/${slug}/index.html`;
        }
    </script>
</body>
</html>
