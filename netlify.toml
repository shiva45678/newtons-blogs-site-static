# Newton's Group Blogs - Netlify Configuration

[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

[[redirects]]
  from = "/blogs/:slug"
  to = "/blogs/:slug/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type = "text/plain"
